  function isTextInput(el){
    if(!el||typeof el!=='object')return false;
    if(el.isContentEditable)return true;
    const tag=String(el.tagName||'').toUpperCase();
    if(tag==='TEXTAREA')return true;
    if(tag==='INPUT'){
      const type=String(el.type||'text').toLowerCase();
      return !['range','checkbox','radio','button','submit','reset','color','file'].includes(type);
    }
    return false;
  }
  function isControlTarget(el){
    if(isTextInput(el))return true;
    const tag=String(el?.tagName||'').toUpperCase();
    if(['SELECT','BUTTON','A','SUMMARY'].includes(tag))return true;
    return !!(typeof el?.closest==='function'&&el.closest('button,a,select,summary,[role="button"],[role="tab"],[role="menuitem"]'));
  }
  function hasModalOpen(){
    if($('ls-dialog')?.open||$('ls-cad-dialog')?.open||$('ls-trace-dialog')?.open||$('ls-force-dialog')?.open)return true;
    return !!(typeof document.querySelector==='function'&&document.querySelector('dialog[open],[role="dialog"],.transmission-workbench'));
  }
  function handleKeydown(e){
    if(e.defaultPrevented)return;
    const mod=!!(e.ctrlKey||e.metaKey),rawKey=String(e.key||''),key=rawKey.toLowerCase();
    if(mod&&!e.altKey){
      if(key==='k'){if(!e.repeat){e.preventDefault();showSearch();}return;}
      if(key==='s'){if(!e.repeat){e.preventDefault();command('save');}return;}
      if(key==='o'){if(!e.repeat){e.preventDefault();command('import');}return;}
      if(!isTextInput(e.target)&&!hasModalOpen()){
        if(key==='z'&&!e.shiftKey){
          e.preventDefault();
          const ed=window.LinkSharkUI.getEditor();
          if(ed){if(ed.canUndo){ed.undo();schedule();}else if(!e.repeat)tell('Đã ở bước cũ nhất, không còn thao tác để hoàn tác.');}
          return;
        }
        if(key==='y'||(key==='z'&&e.shiftKey)){
          e.preventDefault();
          const ed=window.LinkSharkUI.getEditor();
          if(ed){if(ed.canRedo){ed.redo();schedule();}else if(!e.repeat)tell('Không có thao tác nào để làm lại.');}
          return;
        }
      }
      return;
    }
    if(e.altKey)return;
    if(rawKey==='F1'||(rawKey==='?'&&!isTextInput(e.target))){
      if(!e.repeat){e.preventDefault();showShortcuts();}
      return;
    }
    if(isTextInput(e.target)||String(e.target?.tagName||'').toUpperCase()==='SELECT'||hasModalOpen())return;
    const activeEditor=window.LinkSharkUI.getEditor();
    if(!activeEditor)return;
    if(rawKey===' '){
      if(isControlTarget(e.target)||e.repeat)return;
      e.preventDefault();
      activeEditor.running?activeEditor.pause():activeEditor.run();
      schedule();
      return;
    }
    if(key==='.'){
      e.preventDefault();
      activeEditor.step();
      schedule();
      return;
    }
    if(e.repeat)return;
    if(key==='r'){e.preventDefault();activeEditor.reset();schedule();return;}
    if(key==='f'||key==='0'){e.preventDefault();activeEditor.fit();return;}
    if(key==='m'){e.preventDefault();command('tool:cad_mate');return;}
    if(key==='t'||key==='7'){e.preventDefault();command('tool:add_tracer');return;}
    const toolByKey={v:'select','1':'select',l:'add_link','2':'add_link',j:'add_joint','3':'add_joint',g:'add_ground','4':'add_ground',s:'add_slider',e:'add_gear','5':'add_gear',c:'add_chain','6':'add_chain',b:'add_obstacle',p:'draw_path',x:'delete'};
    if(toolByKey[key]){e.preventDefault();command('tool:'+toolByKey[key]);}
  }

</script><script>/* Profile importer and planar assembly UI; native mechanism solver remains authoritative. */
(() => {

  function ensure(){if($('ls-cad-dialog'))return;const d=document.createElement('dialog');d.id='ls-cad-dialog';d.setAttribute('aria-labelledby','cad-title');document.body.append(d);d.addEventListener('cancel',()=>cancelPick());}

  function bodies(){return editor?.model.links.filter(l=>l.cadProfile)||[];}

      <div class="cad-actions"><button class="cad-primary" id="cad-import">＋ Nhập DXF</button><button id="cad-demo">Mở mẫu lắp ghép</button><button id="cad-sample">Tải DXF mẫu</button></div>

      </section></div><p class="cad-fine">Mô phỏng động học dùng khớp và vật rắn. Biên dạng DXF chưa được dùng để tính va chạm đường bao hoặc tự tính khối lượng/quán tính. Các bảng động lực học hiện có vẫn dùng thông số khâu bạn đặt.</p>`);

  function pinOptions(){return bodies().flatMap(l=>l.cadProfile.pins.map((p,i)=>`<option value="${esc(l.id)}|${i}">${esc(l.cadProfile.name+' · '+p.name)}</option>`)).join('');}

  function startPick(mode,extra={}){window.LinkSharkForceUI?.cancel();window.LinkSharkTraceUI?.cancel();editor=getEditor();editor.pause();editor.setTool?.('select');cancelPick();close();pick={mode,...extra};editor.fit();document.body.classList.add('cad-picking');const bar=document.createElement('div');bar.id='cad-pick-bar';bar.innerHTML=`<span id="cad-pick-text">${mode==='mate'?'Ghép 2 tâm · 1/2: chọn tâm thứ nhất đã có':mode==='motor'?'Chọn tâm dẫn động trên khâu đã chọn':mode==='ground'?'Chọn tâm cần neo vào giá':'Chọn tâm cần bỏ cố định'}</span><button id="cad-pick-cancel">Hủy · Esc</button>`;document.body.append(bar);$('cad-pick-cancel').onclick=()=>{cancelPick();showAssembly();};}
  function chooseFile(){const input=document.createElement('input');input.type='file';input.accept='.dxf';input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{if(f.size>8000000)throw Error('DXF vượt 8 MB.');raw=await f.text();parsed=C.parse(raw);filename=f.name;layer='*';acceptedWarnings=false;form={unit:parsed.scale||'',name:f.name.replace(/\.dxf$/i,''),x:'0',y:'0',angle:'0',target:editor.selection?.type==='link'?editor.selection.id:editor.model.links.find(l=>!l.cadHelper)?.id||''};resetPins();showImport();}catch(e){note(e.message);}};input.click();}
  function rememberImport(){for(const key of ['unit','name','x','y','angle','target'])if($('cad-'+key))form[key]=$('cad-'+key).value;if($('cad-accept-warnings'))acceptedWarnings=$('cad-accept-warnings').checked;}

  function showImport(){

      <section><label>Layer<select id="cad-layer">${options([['*','Tất cả layer'],...parsed.layers.map(l=>[l,l])],layer)}</select></label>
      <label>Đơn vị tọa độ DXF<select id="cad-unit">${options([['','Chọn đơn vị…'],['0.001','mm'],['0.01','cm'],['1','m'],['0.0254','inch'],['0.3048','ft']],form.unit)}</select></label>
      <label>Tên khâu<input id="cad-name" value="${esc(form.name)}" maxlength="120"></label>
      <label>Điểm chuẩn A<select id="cad-ref-a">${options(pinItems,referenceA)}</select></label><label>Điểm chuẩn B<select id="cad-ref-b">${options(pinItems,referenceB)}</select></label>
      <label>Thao tác<select id="cad-mode">${options([['new','Tạo khâu mới từ biên dạng'],['attach','Gắn lên thanh đang có']],importMode)}</select></label>
      <label>Thanh nhận biên dạng<select id="cad-target">${options(editor.model.links.filter(l=>!l.cadHelper).map(l=>[l.id,translate(l.name)+' · '+(l.length*1000).toFixed(2)+' mm']),form.target)}</select></label>
      <label>Vị trí A khi tạo mới: X / Y (mm)<span class="cad-pair"><input id="cad-x" type="number" value="${esc(form.x)}" step="10" aria-label="X mm"><input id="cad-y" type="number" value="${esc(form.y)}" step="10" aria-label="Y mm"></span></label>

    $('cad-layer').onchange=e=>{rememberImport();layer=e.target.value;resetPins();showImport();};$('cad-mode').onchange=e=>importMode=e.target.value;
    $('cad-ref-a').onchange=e=>referenceA=Number(e.target.value);$('cad-ref-b').onchange=e=>referenceB=Number(e.target.value);
    $('cad-reset-pins').onclick=()=>{rememberImport();resetPins();showImport();};$('cad-pop-pin').onclick=()=>{rememberImport();pins.pop();showImport();};
    $('cad-preview').onclick=e=>run(()=>{rememberImport();if(pins.length>=32)throw Error('Tối đa 32 điểm liên kết mỗi khâu.');const svg=$('cad-preview'),point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;const local=point.matrixTransform(svg.getScreenCTM().inverse()),p={x:local.x,y:-local.y,name:'Điểm '+(pins.length+1)};if(!pins.some(q=>C.distance(p,q)<Math.max(width,height)*.01))pins.push(p);showImport();});

      if(parsed.warnings.length&&!$('cad-accept-warnings').checked)throw Error('Hãy kiểm tra và xác nhận các đối tượng DXF chưa được nhập.');
      const p=C.profile(parsed,{layer,scale:Number($('cad-unit').value),pins,referenceA,referenceB,name:$('cad-name').value});
      if($('cad-mode').value==='attach'){selected=$('cad-target').value;apply(m=>C.attach(m,selected,p));}
      else{const x=Number($('cad-x').value)/1000,y=Number($('cad-y').value)/1000,angle=Number($('cad-angle').value)*Math.PI/180;if(!Number.isFinite(x+y+angle))throw Error('Vị trí/góc không hợp lệ.');apply(m=>{const base=window.LinkSharkNative.templates[0];const result=C.addBody(m,p,{x,y,angle,jointTemplate:base.joints[1],linkTemplate:base.links[0]});selected=result.linkId;return result.model;});}

  const translate=s=>window.LinkGoI18n?.translate(s)||s;
  function pathD(points){return points.map((p,i)=>(i?'L':'M')+p.x+','+(-p.y)).join('');}
  function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'application/dxf'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function demoDXF(length){return['0','SECTION','2','HEADER','9','$INSUNITS','70','4','0','ENDSEC','0','SECTION','2','ENTITIES','0','LWPOLYLINE','8','BODY','90','4','70','1','10','-10','20','-12','10',String(length+10),'20','-12','10',String(length+10),'20','12','10','-10','20','12',...([0,length].flatMap(x=>['0','CIRCLE','8','BODY','10',String(x),'20','0','40','4'])),'0','ENDSEC','0','EOF'].join('\n')+'\n';}
  function openDemo(){

    return `<div class="force-stats"><div><small>Phản lực khớp lớn nhất</small><b>${num(result.maxPinForceN)} N</b></div><div><small>|Mô-men động cơ| lớn nhất</small><b>${num(result.maxMotorTorqueNm)} N·m</b></div></div><p class="cad-fine">${result.mode==='static'?'Tĩnh: tính tải giữ tư thế, bỏ quán tính và vận tốc.':'Động: xét vận tốc, gia tốc, quán tính ghép và cản nhớt tại khối tâm.'} t = ${num(result.time)} s · Sai số cân bằng ${num(result.forceErrorN)} N / ${num(result.momentErrorNm)} N·m</p>${result.warnings.map(w=>`<p class="force-warning">${esc(w)}</p>`).join('')}<div class="force-table-wrap"><table><caption>Mô-men cần cấp, dấu + ngược chiều kim đồng hồ</caption><thead><tr><th>Nguồn</th><th>Tổng N·m</th><th>Ngoại lực</th><th>Trọng lực</th><th>Quán tính</th><th>Cản</th></tr></thead><tbody>${result.motors.map(v=>`<tr><td>${esc(tr(v.name))}</td><td><b>${num(v.torqueNm)}</b></td><td>${num(v.externalNm)}</td><td>${num(v.gravityNm)}</td><td>${num(v.inertiaNm)}</td><td>${num(v.dampingNm)}</td></tr>`).join('')}</tbody></table></div><div class="force-table-wrap"><table><caption>Phản lực tác dụng lên từng khâu, tọa độ thế giới</caption><thead><tr><th>Khâu / Khớp</th><th>Fx (N)</th><th>Fy (N)</th><th>|F| (N)</th></tr></thead><tbody>${result.bodies.flatMap(b=>b.reactions.map(p=>`<tr><td>${esc(tr(b.name))}<small>${esc(tr(p.name))}</small></td><td>${num(p.fx)}</td><td>${num(p.fy)}</td><td>${num(Math.hypot(p.fx,p.fy))}</td></tr>`)).join('')}</tbody></table></div><details><summary>Khối lượng và quán tính đang dùng</summary><ul>${result.bodies.map(b=>`<li>${esc(tr(b.name))}: ${num(b.mass)} kg · ${num(b.inertia)} kg·m²</li>`).join('')}</ul><p class="cad-fine">Lấy từ thông số khâu hiện có, chưa tự suy ra từ vật liệu/diện tích DXF. Thanh phụ DXF không được tính thêm khối lượng.</p></details>`;
  }
  function show(useSelection=true,override=null){attempt(()=>{
    const e=editor(),m=override||e.model;e.pause();cancel();window.LinkSharkCADUI?.cancelPick();window.LinkSharkTraceUI?.cancel();
    if(doc!==m.id){doc=m.id;host='';draft=null;editing=null;result=null;scanResult=null;}
    if(useSelection){host=bodies(m).find(l=>l.id===e.selection?.id)?.id||host;draft=null;editing=null;}
    if(!draft)draft=defaults(m);if(!m.links.some(l=>l.id===draft.linkId&&!l.cadHelper)){draft=defaults(m);editing=null;}
    if(!$('ls-force-dialog')){const d=document.createElement('dialog');d.id='ls-force-dialog';d.setAttribute('aria-labelledby','force-title');document.body.append(d);}
    const d=$('ls-force-dialog');d.innerHTML=`<header><div><span class="ls-eyebrow">ĐẶT LỰC → TÍNH TẢI → LƯU TRƯỜNG HỢP</span><h2 id="force-title">Ngoại lực & phản lực khớp 2D</h2></div><button id="force-close" aria-label="Đóng bảng lực">×</button></header><div class="force-content"><p class="force-intro">Lực được gắn vào khâu và đi cùng khâu. Bộ tính mới giải cân bằng từng vật rắn để tìm <b>mô-men động cơ và phản lực khớp</b>, dùng được cho cơ cấu nhiều động cơ tại gối cố định.</p><div class="force-layout"><section><h3>1. Đặt ngoại lực</h3><label>Khâu mang lực<select id="force-host">${bodies(m).map(l=>`<option value="${esc(l.id)}" ${l.id===draft.linkId?'selected':''}>${esc(tr(l.name))}${l.cadProfile?' · DXF':''}</option>`).join('')}</select></label><label>Tên lực<input id="force-name" maxlength="120" value="${esc(draft.name)}"></label><button id="force-pick" class="force-primary" ${bodies(m).length?'':'disabled'}>◎ Bấm điểm đặt lực trên bản vẽ</button><div class="force-pair"><label>Dọc từ A→B (mm)<input id="force-along" type="number" step="0.1" value="${esc(draft.along)}"></label><label>Lệch khỏi A–B (mm)<input id="force-normal" type="number" step="0.1" value="${esc(draft.normal)}"></label></div><div class="force-pair"><label>Fx (N)<input id="force-fx" type="number" step="0.1" value="${esc(draft.fx)}"></label><label>Fy (N)<input id="force-fy" type="number" step="0.1" value="${esc(draft.fy)}"></label></div><label>Hướng lực<select id="force-frame"><option value="world" ${draft.frame==='world'?'selected':''}>Cố định theo thế giới: +X phải, +Y lên</option><option value="link" ${draft.frame==='link'?'selected':''}>Quay cùng khâu: +X dọc A→B, +Y bên trái</option></select></label><label>Mô-men ngoài (N·m, + ngược kim đồng hồ)<input id="force-moment" type="number" step="0.1" value="${esc(draft.momentNm)}"></label><p class="cad-fine">Ví dụ lực ép xuống: Fx = 0, Fy = −100, hệ thế giới. Mô-men ngoài là ngẫu lực bổ sung, không phải mô-men động cơ cần tính.</p><div class="force-actions"><button id="force-save" class="force-primary" ${bodies(m).length?'':'disabled'}>${editing?'Lưu thay đổi':'Thêm lực'}</button><button id="force-new">Lực mới</button></div><h3>Các ngoại lực đã lưu</h3><div class="force-load-list">${loads(m).map(l=>`<div class="force-load"><label><input type="checkbox" data-force-enable="${esc(l.id)}" ${l.enabled?'checked':''}>${esc(l.name)}</label><small>${esc(tr(m.links.find(v=>v.id===l.linkId)?.name||'Khâu đã bị xóa'))} · (${num(l.fx)}, ${num(l.fy)}) N · ${num(l.momentNm)} N·m · ${l.frame==='world'?'thế giới':'theo khâu'}</small><div><button data-force-edit="${esc(l.id)}">Sửa / Đổi vị trí</button><button data-force-delete="${esc(l.id)}">Xóa</button></div></div>`).join('')||'<p class="force-empty">Chưa đặt ngoại lực. Vẫn có thể tính trọng lực và quán tính.</p>'}</div><p class="cad-fine">Ngoại lực được lưu trong JSON/bản nháp và có Hoàn tác. Mũi tên trên bản vẽ thể hiện hướng; nhãn ghi độ lớn.</p></section><section><h3>2. Tính tại tư thế đang chọn</h3><label>Chế độ<select id="force-mode"><option value="static" ${(m.sharkForces?.mode||'static')==='static'?'selected':''}>Tĩnh — tải giữ tư thế</option><option value="dynamic" ${m.sharkForces?.mode==='dynamic'?'selected':''}>Động — có trọng lực và quán tính</option></select></label><div class="force-actions"><button id="force-calculate" class="force-primary">Tính tại tư thế này</button><button id="force-mass">Chỉnh thông số khâu</button></div><div id="force-result">${renderResult()}</div><h3>3. Quét tải theo chuyển động</h3><div class="force-pair"><label>Khoảng thời gian (s)<input id="force-duration" type="number" min="0.01" max="30" value="2" step="0.1"></label><label>Số mẫu<input id="force-samples" type="number" min="2" max="300" value="80" step="1"></label></div><div class="force-actions"><button id="force-scan">Quét từ tư thế hiện tại</button><button id="force-cancel-scan" ${controller?'':'disabled'}>Dừng quét</button></div><p id="force-progress" role="status">${scanResult?`${scanResult.cases.length} mẫu · ${num(scanResult.duration)} s · ${scanResult.complete?'Hoàn tất':'Dừng sớm: '+tr(scanResult.stopped)}`:''}</p><div id="force-cases">${scanResult?`<p class="cad-fine">Đỉnh phản lực lấy mẫu: ${num(scanResult.peakPin.result.maxPinForceN)} N tại ${num(scanResult.peakPin.time)} s. Đỉnh mô-men: ${num(scanResult.peakMotor.result.maxMotorTorqueNm)} N·m tại ${num(scanResult.peakMotor.time)} s.</p><label>Trường hợp tải<select id="force-case">${scanResult.cases.map((v,i)=>`<option value="${i}" ${i===caseIndex?'selected':''}>t=${num(v.time)} s · khớp ${num(v.result.maxPinForceN)} N · động cơ ${num(v.result.maxMotorTorqueNm)} N·m</option>`).join('')}</select></label><button id="force-apply-case">Đưa bản vẽ tới tư thế này</button>`:''}</div><p class="cad-fine">Đỉnh trên các mẫu chưa phải cực đại liên tục, ứng suất hay vị trí dễ hỏng. Quét chạy trên bản sao, dừng khi cơ cấu không giải được; không tự thay thiết kế hiện tại.</p><div class="force-actions"><button id="force-json" ${result?'':'disabled'}>Xuất trường hợp tải JSON</button><button id="force-csv" ${result?'':'disabled'}>Xuất bảng lực CSV</button></div></section></div><details class="force-scope"><summary>Phạm vi và cách dùng kết quả</summary><p>Vật rắn phẳng, khớp quay lý tưởng, động cơ tại gối cố định, không có va chạm/ma sát khớp/bánh răng/xích trong bộ tính mới. Bảng truyền động và tải gốc vẫn có sẵn; chúng chưa cộng các ngoại lực ở đây. Chuyển động vẫn theo lệnh động cơ, không bị ngoại lực làm lệch quỹ đạo.</p><p>Chưa tính ứng suất, phá hủy, FEM hay topology. Khi chuyển tải sang FEM cần phân bố tải trên vùng lỗ, giữ đúng điều kiện khớp và xét nhiều tư thế. Khối lượng/quán tính lấy từ thông số hiện có; chưa tự tính từ vật liệu DXF.</p></details><p id="force-error" role="alert"></p></div>`;
    $('force-close').onclick=close;if(!d.open)d.showModal();$('force-host').onchange=remember;$('force-pick').onclick=()=>attempt(begin);
    $('force-save').onclick=()=>attempt(()=>{const current=editor().model,f=checkedDraft(current),next=commit(editing?loads(current).map(l=>l.id===editing?f:l):[...loads(current),f]);editing=null;draft=null;show(false,next);note('Đã lưu ngoại lực. Bấm Tính tại tư thế này để xem tải.');});
    $('force-new').onclick=()=>{editing=null;draft=null;show(false);};
    for(const b of document.querySelectorAll('[data-force-edit]'))b.onclick=()=>{remember();const l=loads(editor().model).find(l=>l.id===b.dataset.forceEdit),hostLink=editor().model.links.find(v=>v.id===l.linkId);if(!hostLink)return note('Khâu mang lực đã bị xóa. Hãy xóa lực này.');editing=l.id;host=l.linkId;draft={...l,along:l.ratio*hostLink.length*1000,normal:l.normalOffset*1000};show(false);};
    for(const b of document.querySelectorAll('[data-force-delete]'))b.onclick=()=>attempt(()=>{remember();const next=commit(loads(editor().model).filter(l=>l.id!==b.dataset.forceDelete));if(editing===b.dataset.forceDelete){editing=null;draft=null;}show(false,next);});
    for(const b of document.querySelectorAll('[data-force-enable]'))b.onchange=()=>attempt(()=>{remember();const next=commit(loads(editor().model).map(l=>l.id===b.dataset.forceEnable?{...l,enabled:b.checked}:l));show(false,next);});
    $('force-mode').onchange=()=>attempt(()=>{remember();commit(loads(editor().model));result=null;scanResult=null;$('force-result').innerHTML=renderResult();$('force-cases').innerHTML='';$('force-json').disabled=true;$('force-csv').disabled=true;});
    $('force-calculate').onclick=()=>attempt(()=>{remember();const current=editor();result=F.calculate(current.model,current.evaluation,{mode:$('force-mode').value,time:current.time||0});analyzedModel=current.model;scanResult=null;$('force-result').innerHTML=renderResult();$('force-error').textContent='';$('force-cases').innerHTML='';$('force-progress').textContent='';$('force-json').disabled=false;$('force-csv').disabled=false;});
    $('force-mass').onclick=()=>{close();editor().openSection('links');};$('force-scan').onclick=()=>scan();$('force-cancel-scan').onclick=()=>controller?.abort();
    if($('force-case'))$('force-case').onchange=()=>{caseIndex=Number($('force-case').value);result=scanResult.cases[caseIndex].result;$('force-result').innerHTML=renderResult();};
    if($('force-apply-case'))$('force-apply-case').onclick=()=>attempt(()=>{const entry=scanResult.cases[caseIndex];editor().applyForceState(entry.state);close();note('Đã chuyển tới tư thế tải được chọn. Có thể Hoàn tác.');});
    $('force-json').onclick=()=>attempt(()=>{if(!result)throw Error('Tính lại tải trước khi xuất.');const entry=scanResult?.cases[caseIndex]||{result};download('link-shark-truong-hop-tai.json',JSON.stringify(F.loadCase(editor().model,entry),null,2),'application/json');});
    $('force-csv').onclick=()=>attempt(()=>{if(!result)throw Error('Tính lại tải trước khi xuất.');download('link-shark-luc.csv',F.csv(scanResult?.cases||[{result}]),'text/csv;charset=utf-8');});
  });}
  function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  async function scan(){
    if(controller)return;const current=editor();remember();const mode=$('force-mode').value,duration=Number($('force-duration').value),samples=Number($('force-samples').value);controller=new AbortController();const signal=controller.signal;scanModel=current.model;current.pause();$('force-scan').disabled=true;$('force-cancel-scan').disabled=false;$('force-error').textContent='';
    const initial={model:current.model,time:current.time||0,driverOverrides:current.driverOverrides||{}};
    try{const out=await F.scan(initial,{mode,duration,samples,signal,advance:window.LinkSharkNative.advance,evaluate:window.LinkSharkNative.evaluateState,progress:v=>{if($('force-progress'))$('force-progress').textContent=`Đang quét ${Math.round(v*100)}%…`;}});if(editor().model!==current.model)throw Error('Thiết kế đã đổi trong khi quét; hãy tính lại.');scanResult=out;caseIndex=out.cases.indexOf(out.peakPin);result=out.peakPin.result;analyzedModel=current.model;controller=null;if($('ls-force-dialog')?.open)show(false);}
    catch(e){note(e.message);if($('force-error'))$('force-error').textContent=e.message;}
    finally{controller=null;if($('force-scan'))$('force-scan').disabled=false;if($('force-cancel-scan'))$('force-cancel-scan').disabled=true;}
  }
  function begin(){const e=editor();remember();const l=e.model.links.find(l=>l.id===draft.linkId);if(!l)throw Error('Chọn khâu mang lực.');G.frame(l,e.evaluation.solvedJoints);window.LinkSharkCADUI?.cancelPick();window.LinkSharkTraceUI?.cancel();cancel();pick={linkId:l.id,documentId:e.model.id};e.pause();e.setTool('select');close();document.body.classList.add('force-picking');const bar=document.createElement('div');bar.id='force-pick-bar';bar.innerHTML=`<div><b>Điểm đặt lực · ${esc(tr(l.name))}</b><small>Bấm vị trí trên khâu; hút A/B, trung điểm, tâm lỗ và cạnh DXF.</small></div><button id="force-pick-cancel">Hủy · Esc</button>`;document.body.append(bar);$('force-pick-cancel').onclick=()=>{cancel();show(false);};e.fit();}
  function cancel(){const active=!!pick;pick=null;$('force-pick-bar')?.remove();document.body.classList.remove('force-picking');if(active)window.LinkSharkUI.getEditor()?.fit();}
  function draw(ctx,model,joints,solvedLinks,project,scale){
    const e=window.LinkSharkUI.getEditor();if(!e||e.model.id!==model.id)return;scene={model,joints,project,scale};ctx.save();
    try{
      for(const l of loads(model).filter(l=>l.enabled)){if(!model.links.some(v=>v.id===l.linkId))continue;const f=F.forceAt(l,model.links,joints),p=project(f.x,f.y),mag=Math.hypot(f.fx,f.fy);ctx.strokeStyle='#e15c36';ctx.fillStyle='#ba3c18';ctx.lineWidth=2.5;ctx.setLineDash([]);ctx.beginPath();ctx.arc(p.sx,p.sy,4,0,Math.PI*2);ctx.fill();if(mag){const dx=f.fx/mag*64,dy=-f.fy/mag*64,x=p.sx+dx,y=p.sy+dy,angle=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(p.sx,p.sy);ctx.lineTo(x,y);ctx.moveTo(x-10*Math.cos(angle-.4),y-10*Math.sin(angle-.4));ctx.lineTo(x,y);ctx.lineTo(x-10*Math.cos(angle+.4),y-10*Math.sin(angle+.4));ctx.stroke();ctx.font='bold 11px Segoe UI';ctx.fillText(`${l.name}: ${num(mag)} N`,x+6,y-6);}if(f.momentNm){ctx.font='bold 11px Segoe UI';ctx.fillText(`M=${num(f.momentNm)} N·m`,p.sx+8,p.sy+18);}}
      if(pick&&pick.documentId===model.id){const l=model.links.find(l=>l.id===pick.linkId);if(l){const f=G.frame(l,joints);ctx.strokeStyle='#e15c36';ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.beginPath();if(l.cadProfile)for(const path of l.cadProfile.paths){path.points.forEach((p,i)=>{const q=project(f.a.x+p.x*f.ux-p.y*f.uy,f.a.y+p.x*f.uy+p.y*f.ux);if(i)ctx.lineTo(q.sx,q.sy);else ctx.moveTo(q.sx,q.sy);});if(path.closed)ctx.closePath();}else{const a=project(f.a.x,f.a.y),b=project(f.b.x,f.b.y);ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);}ctx.stroke();ctx.setLineDash([]);for(const p of G.anchors(l,joints)){const q=project(p.x,p.y);ctx.beginPath();ctx.arc(q.sx,q.sy,6,0,Math.PI*2);ctx.stroke();}}}
    }catch(error){if(pick){cancel();note(error.message);}}finally{ctx.restore();}
  }
  document.addEventListener('pointerdown',event=>{if(!pick||!scene||event.target.tagName!=='CANVAS'||scene.model.id!==pick.documentId)return;event.preventDefault();event.stopImmediatePropagation();swallowUntil=Date.now()+800;attempt(()=>{const rect=event.target.getBoundingClientRect(),o=scene.project(0,0),u=scene.project(1,1),sx=u.sx-o.sx,sy=u.sy-o.sy;if(Math.abs(sx*sy)<1e-12)throw Error('Chưa xác định được tọa độ bản vẽ.');const point={x:(event.clientX-rect.left-o.sx)/sx,y:(event.clientY-rect.top-o.sy)/sy},l=scene.model.links.find(l=>l.id===pick.linkId),snapped=G.snap(l,scene.joints,point,scene.project),local=G.local(l,scene.joints,snapped);draft.along=local.along*1000;draft.normal=local.normalOffset*1000;cancel();show(false);});},true);
  for(const type of ['pointerup','click'])document.addEventListener(type,event=>{if(event.target.tagName==='CANVAS'&&Date.now()<swallowUntil){event.preventDefault();event.stopImmediatePropagation();}},true);
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&pick){cancel();show(false);event.preventDefault();}});
  window.LinkSharkForceUI={show:()=>show(true),cancel,draw,update(e,active){if(pick&&(!active||!e||e.model.id!==pick.documentId||e.tool!=='select'||!e.model.links.some(l=>l.id===pick.linkId)))cancel();if(controller&&(!active||e?.model!==scanModel))controller.abort();if(analyzedModel&&e?.model!==analyzedModel){result=null;scanResult=null;analyzedModel=null;if($('force-result'))$('force-result').innerHTML=renderResult();if($('force-cases'))$('force-cases').innerHTML='';if($('force-json'))$('force-json').disabled=true;if($('force-csv'))$('force-csv').disabled=true;}}};
})();
</script>

hớp, con trượt và vùng cản trong bảng phải.", "Open tools for links, joints, sliders and obstacle regions in the right panel."], ["调整兴趣点", "Chỉnh điểm khảo sát trên thanh để theo dõi quỹ đạo và tính miền làm việc.", "Edit a point attached to a link for trajectory and workspace analysis."], ["添加兴趣点", "Thêm điểm khảo sát gắn với một thanh. Điểm này sẽ đi theo thanh khi chạy.", "Add a point attached to a link; it follows that link during simulation."], ["添加感兴趣点", "Thêm điểm để theo dõi quỹ đạo trên thanh đã chọn.", "Add a tracking point to the selected link."], ["绘制连杆", "Chọn công cụ rồi kéo trên bản vẽ để tạo thanh; bật bắt điểm để nối chính xác vào nút.", "Choose this tool, then drag on the canvas to create a link. Snapping helps connect nodes."], ["绘制刚性连杆", "Kéo trên bản vẽ để tạo thanh cứng có chiều dài ràng buộc.", "Drag on the canvas to create a rigid link with a constrained length."], ["旋转铰链", "Đặt nút khớp quay: các thanh nối vào nút có thể quay tương đối.", "Place a revolute joint where connected links can rotate relative to each other."], ["固定支座", "Đặt hoặc đổi nút thành gối cố định trên giá; đây là mốc giữ cơ cấu.", "Place or toggle a node fixed to the frame, anchoring the mechanism."], ["直线滑块", "Thêm con trượt; hướng ray và giới hạn hành trình được chỉnh trong thuộc tính.", "Add a slider; edit its rail direction and travel limits in the properties panel."], ["固定区域", "Đặt vùng cản đứng yên để kiểm tra giao thoa với cơ cấu.", "Place a stationary obstacle region to check mechanism interference."], ["随动区域", "Gắn vùng hình học vào thanh để kiểm tra phần bao chuyển động.", "Attach a shape to a link to check its moving envelope."], ["齿轮啮合", "Chọn lần lượt hai tâm quay để tạo cặp bánh răng; chỉnh tỷ số truyền ở bảng trái.", "Select two rotary centers in sequence to create gears; edit the ratio in the left panel."], ["链轮传动", "Chọn lần lượt hai tâm quay để tạo bộ truyền xích.", "Select two rotary centers in sequence to create a chain drive."], ["擦除", "Mở tùy chọn xóa. Kiểm tra đối tượng trước khi xóa; có thể dùng Hoàn tác nếu nhầm.", "Open erase options. Check your selection before deleting; use Undo to recover a mistake."], ["删除选中", "Xóa các đối tượng đã chọn cùng cấu hình liên quan. Có thể hoàn tác.", "Delete selected objects and related configuration. Undo is available."], ["删除元素", "Chọn công cụ xóa rồi nhấn đối tượng cần bỏ khỏi bản vẽ.", "Select the erase tool, then click an object to remove it from the canvas."], ["运行", "Bắt đầu hoặc tiếp tục mô phỏng theo nguồn dẫn động đã cấu hình.", "Start or resume simulation using the configured drives."], ["暂停", "Dừng tạm tại tư thế hiện tại để quan sát hoặc xem tải.", "Pause at the current pose to inspect motion or loads."], ["单步", "Tiến mô phỏng một bước theo thời gian bước đã đặt; hữu ích khi quan sát gần điểm chết.", "Advance by the configured step duration, useful near a dead center."], ["复位", "Đưa mô phỏng về trạng thái bắt đầu, giữ lại thiết kế và cài đặt môi trường.", "Return simulation to its starting state while retaining the design and environment settings."], ["适合视图", "Thu phóng và căn giữa để thấy toàn bộ cơ cấu.", "Zoom and center the view to show the complete mechanism."], ["放大画布", "Phóng to để thao tác chính xác hơn với nút và thanh.", "Zoom in for precise node and link editing."], ["缩小画布", "Thu nhỏ để quan sát cơ cấu và vùng chuyển động rộng hơn.", "Zoom out to see more of the mechanism and its motion envelope."], ["元素吸附", "Bật/tắt bắt điểm vào nút, trung điểm, cạnh và điểm khảo sát.", "Toggle snapping to nodes, midpoints, edges and points of interest."], ["网格吸附", "Bật/tắt bắt tọa độ vào lưới khi vẽ.", "Toggle snapping to the coordinate grid while drawing."], ["多选与框选", "Bật chế độ chọn nhiều hoặc kéo khung để chọn một nhóm đối tượng.", "Enable multiple selection or drag a box around a group of objects."], ["全选", "Chọn toàn bộ các đối tượng để thao tác theo nhóm.", "Select all objects for group operations."], ["复制选中", "Sao chép nhóm đã chọn và các liên kết hình học liên quan.", "Copy the selection and its related geometric connections."], ["清除选择", "Bỏ chọn các đối tượng hiện tại, giữ nguyên thiết kế.", "Deselect the current objects while keeping the design."], ["水平对齐节点", "Căn các nút đã chọn theo hàng ngang; cần ít nhất hai nút.", "Align selected nodes horizontally; requires at least two nodes."], ["垂直对齐节点", "Căn các nút đã chọn theo hàng dọc; cần ít nhất hai nút.", "Align selected nodes vertically; requires at least two nodes."], ["水平等距分布", "Giãn đều các nút theo phương ngang; cần ít nhất ba nút.", "Distribute nodes evenly horizontally; requires at least three nodes."], ["垂直等距分布", "Giãn đều các nút theo phương dọc; cần ít nhất ba nút.", "Distribute nodes evenly vertically; requires at least three nodes."], ["组成刚体", "Gộp các thanh nối nhau thành vật rắn để giữ nguyên hình dạng tương đối.", "Group connected links into a rigid body to preserve their relative shape."], ["解除刚体", "Tách nhóm vật rắn để có thể chỉnh lại từng thanh.", "Release the rigid group so individual links can be edited again."], ["记录姿态", "Ghi vị trí tất cả các nút làm một tư thế khóa; ghi ít nhất hai tư thế để phát lặp.", "Save all node positions as a key pose; record at least two poses for looping."], ["拖动录曲线", "Bật ghi rồi kéo nút bằng tay để ghi liên tục chuyển động của toàn cơ cấu.", "Enable recording, then drag a node to capture the mechanism motion continuously."], ["拖动录制", "Bật ghi rồi kéo nút để lưu các tư thế trong quá trình kéo.", "Enable recording, then drag a node to capture poses along the motion."], ["停止录制", "Kết thúc việc lấy mẫu chuyển động kéo tay.", "Stop capturing manually dragged motion."], ["清空姿态", "Xóa các tư thế đã ghi; hình học thiết kế vẫn được giữ.", "Clear recorded poses while retaining the mechanism geometry."], ["启动轮回", "Phát lặp giữa ít nhất hai tư thế đã ghi theo đường chuyển động trơn.", "Loop smoothly between at least two recorded poses."], ["停止轮回", "Dừng phát lặp tư thế để tiếp tục chỉnh cơ cấu.", "Stop pose looping to resume mechanism editing."], ["手绘轨迹", "Vẽ đường đi mong muốn trên bản vẽ để dùng cho tổng hợp hoặc dẫn động quỹ đạo.", "Draw the desired path for mechanism synthesis or trajectory-driven motion."], ["生成机构", "Tạo cơ cấu cố gắng bám quỹ đạo đã vẽ theo cấu hình đã chọn; kết quả cần kiểm tra lại.", "Generate a mechanism that attempts to follow your drawn path; inspect the resulting design."], ["调整当前机构", "Tìm cách chỉnh các thông số chưa khóa để cơ cấu hiện tại bám quỹ đạo mục tiêu tốt hơn.", "Adjust unlocked parameters to improve the current mechanism's fit to the target path."], ["视图设置", "Chọn lớp hiển thị: tên nút, kích thước, véc-tơ vận tốc/gia tốc, đồ thị và chú giải.", "Choose visible layers: names, dimensions, velocity/acceleration vectors, plots and legends."], ["切换主题", "Đổi giữa giao diện sáng và tối.", "Switch between light and dark themes."], ["传动计算与选型", "Tính sơ bộ bánh răng, xích hoặc đai răng; kiểm tra đơn vị và các cảnh báo kết quả.", "Size gears, chains or timing belts; check units and result warnings."], ["自动选型", "Tìm tổ hợp thông số tiêu chuẩn thỏa các điều kiện đã khóa.", "Find a standard parameter combination that satisfies locked constraints."], ["生成到画布", "Đưa bộ truyền đã tính vào bản vẽ. Đai răng chỉ là sơ đồ, không mô phỏng tải/chuyển động.", "Insert the sized transmission. Timing belts are layouts only, without motion/load simulation."], ["动力学与扭矩", "Xem mô-men, lực và các thành phần tải của nguồn dẫn động đã chọn.", "Inspect torque, force and load components for the selected drive."], ["连杆参数", "Chỉnh chiều dài, khối lượng và vị trí khối tâm của từng thanh.", "Edit each link's length, mass and center of mass."], ["连杆尺寸", "Xem/chỉnh kích thước hình học của các thanh.", "Inspect or edit link geometry and dimensions."], ["原动力", "Cấu hình nguồn quay hoặc tịnh tiến: tốc độ, kiểu chuyển động và chế độ điều khiển.", "Configure rotary or linear drives: speed, motion type and control mode."], ["节点与约束", "Chỉnh loại nút, ray trượt, giới hạn góc/hành trình, cản và lò xo.", "Edit node type, slider rails, angle/stroke limits, resistance and springs."], ["传动与碰撞", "Chỉnh bộ truyền, kiểm tra va chạm, mặt đất và đáp ứng tiếp xúc.", "Edit transmissions, collision checks, ground and contact response."], ["工作空间", "Xem miền với tới và bản đồ nhiệt tải tại điểm khảo sát; màu xám là tải chưa biết.", "Inspect reach and the load heatmap at a tracking point; gray means unknown load."], ["当前姿态 CSV", "Xuất dữ liệu của tư thế hiện tại để phân tích bằng bảng tính.", "Export current pose data for spreadsheet analysis."], ["采样轨迹 CSV", "Xuất các mẫu quỹ đạo đã tính thành CSV.", "Export computed trajectory samples as CSV."], ["画布 PNG", "Xuất ảnh bản vẽ hiện tại thành PNG.", "Export the current canvas as a PNG image."], ["关闭", "Đóng bảng hoặc hộp thoại này để trở lại thiết kế.", "Close this panel or dialog to return to the design."], ["展开所有分组", "Mở toàn bộ nhóm thông số trong bảng trái.", "Expand all parameter groups in the left panel."], ["折叠所有分组", "Thu gọn các nhóm để dễ tìm mục cần xem.", "Collapse groups to make the panel easier to navigate."]], guides={"vi": {"title": "Hướng dẫn sử dụng linkS", "intro": "Bắt đầu bằng một cơ cấu mẫu để hiểu chuyển động, rồi mới vẽ cơ cấu riêng. Bạn có thể mở hướng dẫn này bất cứ lúc nào bằng nút ? hoặc phím F1.", "close": "Đóng hướng dẫn", "nav": "Nội dung hướng dẫn", "sections": [["start", "1. Thử ngay trong 3 phút", "<ol><li>Từ trang đầu, nhấn <b>Tạo bản vẽ trống</b>.</li><li>Trên thanh trên, nhấn nút <b>ba chấm (Thao tác khác)</b>. Trong <b>Cơ cấu mẫu</b>, chọn <b>Cơ cấu bốn khâu tay quay – cần lắc</b>.</li><li>Nhấn <b>Chạy ▶</b>. Quan sát tay quay quay, cần lắc dao động và điểm khảo sát vẽ đường cong.</li><li>Nhấn <b>Tạm dừng ⏸</b>. Chọn <b>Kéo thả ✋</b>, rồi nhấn một thanh để xem thuộc tính ở bảng phải.</li><li>Mở <b>Cây mô hình</b> ở góc trên trái. Trong <b>Thông số thanh</b>, thử đổi nhẹ chiều dài một thanh, rồi chạy lại để xem đường đi thay đổi.</li><li>Nhấn <b>Lưu JSON</b> để tải thiết kế về máy. Đây là cách giữ một bản sao có thể chuyển sang máy khác.</li></ol><p class=\"lg-note\">Nếu không thấy toàn bộ cơ cấu, nhấn <b>Vừa khung nhìn</b> ở thanh dưới. Nếu sửa xong cơ cấu không chạy, dùng <b>Hoàn tác ↩</b> để trở lại bước trước.</p>"], ["layout", "2. Nhận biết các phần giao diện", "<dl><dt>Thanh trên</dt><dd>Về trang chính, tạo/lưu thiết kế, menu ba chấm, chọn ngôn ngữ, hướng dẫn, các thẻ thiết kế, chọn/vẽ, hoàn tác, xóa và chạy/tạm dừng.</dd><dt>Bảng trái — Cây mô hình</dt><dd>Chỉnh thanh, nguồn dẫn động, nút/ràng buộc, bộ truyền/va chạm và xem động lực học, miền làm việc.</dd><dt>Bản vẽ giữa</dt><dd>Hiện cơ cấu và quỹ đạo. Nhấn đối tượng để chọn; trong chế độ Kéo thả, kéo nút để quan sát tư thế.</dd><dt>Bảng phải — Thuộc tính và vẽ</dt><dd>Sửa đối tượng đang chọn, mở Hộp công cụ phác thảo, ghi tư thế và tổng hợp cơ cấu từ quỹ đạo.</dd><dt>Thanh dưới</dt><dd>Thu phóng, vừa khung, bắt điểm, chọn nhiều, chạy một bước, đặt lại và tốc độ phát. Màn hình nhỏ có thể sắp các mục thành nhiều hàng.</dd></dl>"], ["draw", "3. Tự tạo và sửa cơ cấu", "<ol><li>Tạo bản vẽ trống. Mở <b>Bảng vẽ</b> bên phải, tìm <b>Hộp công cụ phác thảo</b>.</li><li>Chọn <b>Vẽ thanh liên kết</b>, kéo trên bản vẽ để tạo thanh. Bật <b>Bắt điểm đối tượng</b> để đầu thanh mới nối đúng vào nút cũ.</li><li>Thêm <b>Gối cố định</b> tại nút cần gắn vào giá. Khớp quay cho phép các thanh quay tương đối; con trượt đi theo một ray.</li><li>Trở về <b>Kéo thả</b>, nhấn thanh hoặc nút để chọn. Chỉnh chiều dài/khối lượng của thanh hoặc hướng ray/giới hạn của nút trong bảng thuộc tính.</li><li>Trong bảng trái, mở <b>Nguồn dẫn động</b> để cấu hình dẫn động quay hoặc tịnh tiến, chọn tốc độ và dạng chuyển động.</li><li>Chạy thử, kiểm tra có xung đột ràng buộc hoặc chạm giới hạn không. Lưu JSON sau khi đạt thiết kế mong muốn.</li></ol><p class=\"lg-note\">Đường cong cần theo dõi được gắn với một <b>điểm khảo sát</b> trên thanh. Điểm khảo sát là điểm đo, không phải gối cố định hay một thanh mới.</p>"], ["motion", "4. Điều khiển mô phỏng và ghi chuyển động", "<ul><li><b>Chạy / Tạm dừng:</b> phát hoặc dừng tại tư thế hiện tại.</li><li><b>Chạy một bước:</b> tiến đúng một bước thời gian đã đặt; dùng khi muốn quan sát chậm quanh vị trí khó.</li><li><b>Đặt lại:</b> về trạng thái bắt đầu của mô phỏng, giữ thiết kế.</li><li><b>Tốc độ phát:</b> đổi tốc độ quan sát; không dùng việc phát nhanh/chậm làm bằng chứng rằng động cơ thực đáp ứng được.</li><li><b>Ghi tư thế:</b> kéo đến một tư thế rồi nhấn ghi. Lặp lại ở ít nhất hai tư thế, sau đó dùng phát lặp trong mục <b>Tư thế và phát lặp</b>.</li><li><b>Kéo để ghi quỹ đạo:</b> bật ghi, kéo một nút, rồi dừng ghi để lưu quá trình di chuyển.</li></ul>"], ["analysis", "5. Xem quỹ đạo, tải và miền làm việc", "<ol><li>Thêm hoặc chọn <b>điểm khảo sát</b> trên thanh cần quan sát; chỉnh vị trí dọc thanh và độ lệch vuông góc nếu cần.</li><li>Chạy cơ cấu để xem đường đi của điểm đó. Dùng menu ba chấm → <b>Cài đặt hiển thị</b> để bật tên, kích thước, véc-tơ và chú giải cần thiết.</li><li>Trong bảng trái, mở <b>Động lực học và mô-men</b> để xem lực/mô-men của dẫn động; kiểm tra khối lượng, trọng lực và tải đã nhập.</li><li>Mở <b>Không gian làm việc</b>, chọn điểm đánh giá và độ phân giải. Bắt đầu ở mức nhanh hoặc tiêu chuẩn để giảm thời gian chờ.</li></ol><p class=\"lg-note\"><b>Màu xám = tải chưa biết.</b> Kết quả “không tính được tải”, tư thế không hội tụ hoặc mẫu chưa đủ không có nghĩa là tải bằng 0. Các kết quả là đánh giá mô hình; cần kiểm tra riêng trước khi chế tạo.</p>"], ["transmission", "6. Bánh răng, xích và đai răng", "<p>Mở menu ba chấm → <b>Tính toán và chọn bộ truyền</b>. Chọn loại bộ truyền, nhập công suất/tốc độ/tỷ số truyền/khoảng cách trục cùng đơn vị tương ứng. Khóa các thông số bắt buộc, dùng <b>Chọn thông số tự động</b>, đọc cảnh báo rồi mới <b>Đưa vào bản vẽ</b>.</p><p>Để tạo cặp bánh răng hoặc xích trực tiếp bằng công cụ vẽ, chọn lần lượt hai tâm quay. Các tâm phải có gối hoặc thanh quay phù hợp.</p><p class=\"lg-note\"><b>Đai răng chỉ là sơ đồ:</b> không tham gia mô phỏng chuyển động và tải. Kiểm tra bền ban đầu không thay thế kiểm tra mỏi, tiếp xúc, bôi trơn và dữ liệu nhà sản xuất.</p>"], ["save", "7. Lưu, mở lại và xuất kết quả", "<ul><li><b>Lưu JSON:</b> tải tệp cơ cấu để sao lưu. Đổi tên tệp theo phiên bản để giữ các phương án.</li><li><b>Mở tệp JSON / Nhập JSON:</b> đọc lại tệp thiết kế đã lưu.</li><li><b>Bản nháp cục bộ:</b> tiện dùng trên cùng trình duyệt; không thay thế tệp sao lưu khi đổi máy hoặc xóa dữ liệu trình duyệt.</li><li><b>CSV / PNG:</b> các mục xuất tương ứng lưu dữ liệu tư thế, quỹ đạo, tải hoặc ảnh bản vẽ. Có thể cần tính/lấy mẫu trước khi xuất.</li></ul>"], ["trouble", "8. Khi chưa thao tác được", "<dl><dt>Nhấn Chạy nhưng cơ cấu không chuyển động</dt><dd>Kiểm tra đã có nguồn dẫn động, đang bật và không ở chế độ định vị thủ công. Thử cơ cấu mẫu bốn khâu để đối chiếu.</dd><dt>Không thấy bảng thuộc tính hoặc công cụ vẽ</dt><dd>Mở Bảng vẽ ở góc trên phải. Nhấn một thanh để chọn và mở phần thuộc tính.</dd><dt>Cơ cấu bị kẹt, báo ràng buộc hoặc giới hạn</dt><dd>Tạm dừng. Xem cảnh báo, kiểm tra chiều dài thanh, gối cố định, giới hạn góc/hành trình. Hoàn tác thay đổi gần nhất nếu cần.</dd><dt>Chỉ thấy một phần cơ cấu</dt><dd>Nhấn Vừa khung nhìn ở thanh dưới, rồi đóng bớt hai bảng bên để rộng chỗ.</dd><dt>Mở HTML trên iPad nhưng không bấm được</dt><dd>Dùng Chia sẻ → Mở bằng Safari thay cho xem trước trong ứng dụng Tệp.</dd><dt>Muốn biết nút biểu tượng làm gì</dt><dd>Đưa chuột lên nút hoặc dùng phím Tab để chuyển tiêu điểm tới nút. Trên màn hình cảm ứng, mở hướng dẫn này để xem các nhóm chức năng.</dd></dl>"]]}, "en": {"title": "linkS user guide", "intro": "Start with a sample mechanism to understand motion, then build your own. Open this guide at any time using the ? button or F1.", "close": "Close guide", "nav": "Guide contents", "sections": [["start", "1. Your first mechanism in 3 minutes", "<ol><li>On the home page, click <b>New blank canvas</b>.</li><li>Open the <b>three-dot menu (More actions)</b>. Under <b>Mechanism templates</b>, choose <b>Classic four-bar crank-rocker</b>.</li><li>Click <b>Run ▶</b>. Watch the crank turn, the rocker oscillate and the tracking point draw a curve.</li><li>Click <b>Pause ⏸</b>. Choose <b>Drag ✋</b>, then click a link to inspect its properties on the right.</li><li>Open <b>Model tree</b> at the top left. Under <b>Link parameters</b>, make a small length change, then run again to compare the path.</li><li>Click <b>Save JSON</b> to download a design backup that can be opened on another computer.</li></ol><p class=\"lg-note\">Use <b>Fit view</b> in the bottom toolbar if the mechanism is outside the view. Use <b>Undo ↩</b> if an edit prevents it from moving.</p>"], ["layout", "2. Find your way around", "<dl><dt>Top toolbar</dt><dd>Home, new/save, three-dot menu, language, guide, design tabs, select/sketch, undo, erase and run/pause.</dd><dt>Left panel — Model tree</dt><dd>Link properties, drives, nodes/constraints, transmissions/collisions, dynamics and workspace analysis.</dd><dt>Center canvas</dt><dd>The mechanism and its traces. Click an object to select it; use Drag mode to move a node and inspect poses.</dd><dt>Right panel — Properties and drawing</dt><dd>Selected object properties, sketch toolbox, pose recording and path-based synthesis.</dd><dt>Bottom toolbar</dt><dd>Zoom, fit, snapping, multi-selection, single step, reset and playback speed. Small screens may arrange controls across several rows.</dd></dl>"], ["draw", "3. Build and edit a mechanism", "<ol><li>Create a blank canvas. Open the right <b>Drawing panel</b> and find the <b>Sketch toolbox</b>.</li><li>Choose <b>Draw link</b> and drag on the canvas. Enable <b>Element snapping</b> to connect new endpoints accurately to existing nodes.</li><li>Place a <b>Fixed support</b> at a node anchored to the frame. Revolute joints allow relative rotation; sliders move along a rail.</li><li>Return to <b>Drag</b> and select a link or node. Edit link length/mass, or rail direction and node limits in its properties.</li><li>Open <b>Drive source</b> on the left to configure a rotary or linear drive, its speed and motion type.</li><li>Run and check constraint conflicts or limits. Save JSON when satisfied.</li></ol><p class=\"lg-note\">A <b>point of interest</b> is a measurement point attached to a link for tracking. It is not a fixed support or another link.</p>"], ["motion", "4. Control and record motion", "<ul><li><b>Run / Pause:</b> play or stop at the current pose.</li><li><b>Single step:</b> advance by one configured time step to inspect difficult positions slowly.</li><li><b>Reset:</b> return simulation to its starting state while retaining the design.</li><li><b>Playback speed:</b> changes viewing speed; fast or slow playback does not prove a real motor can achieve that motion.</li><li><b>Record pose:</b> drag to a pose and record it. Capture at least two, then use looping under <b>Poses and looping</b>.</li><li><b>Record path by dragging:</b> enable recording, drag a node, then stop to retain the motion sequence.</li></ul>"], ["analysis", "5. Inspect paths, loads and workspace", "<ol><li>Add or select a <b>point of interest</b> on the link to track. Adjust its along-link position and normal offset as needed.</li><li>Run to observe its path. Use More actions → <b>View settings</b> to choose labels, dimensions, vectors and legends.</li><li>Open <b>Dynamics and torque</b> on the left to inspect drive loads; check the entered masses, gravity and external loads.</li><li>Open <b>Workspace</b>, choose the evaluation point and resolution. Start with Fast or Standard to reduce computation time.</li></ol><p class=\"lg-note\"><b>Gray means unknown load.</b> Unavailable load, unconverged poses or missing samples do not mean zero load. These are model estimates that require separate verification before fabrication.</p>"], ["transmission", "6. Gears, chains and timing belts", "<p>Open More actions → <b>Transmission sizing and selection</b>. Choose a type and enter power, speed, ratio and center distance with the correct units. Lock required parameters, use <b>Automatic sizing</b>, read the warnings, then <b>Generate on canvas</b>.</p><p>To draw gears or chains directly, select two rotary centers in sequence. The centers need appropriate fixed supports or rotary links.</p><p class=\"lg-note\"><b>Timing belts are layouts only:</b> they are excluded from motion and load simulation. Preliminary strength checks do not replace fatigue, contact, lubrication or manufacturer-data checks.</p>"], ["save", "7. Save, reopen and export", "<ul><li><b>Save JSON:</b> download a mechanism backup. Use versioned filenames to keep design alternatives.</li><li><b>Open JSON file / Import JSON:</b> reopen a saved mechanism.</li><li><b>Local drafts:</b> useful in the same browser, but not a substitute for a backup when changing computers or clearing browser data.</li><li><b>CSV / PNG:</b> export pose, trajectory, load data or a canvas image using the corresponding export controls. Some exports require calculation or sampling first.</li></ul>"], ["trouble", "8. Troubleshooting", "<dl><dt>Run does not move the mechanism</dt><dd>Check that a drive exists, is enabled and is not using manual positioning. Compare with the four-bar sample.</dd><dt>Properties or drawing tools are missing</dt><dd>Open the Drawing panel at the top right. Click a link to select it and display its properties.</dd><dt>The mechanism locks up or reports constraints/limits</dt><dd>Pause. Read the warning and check link lengths, fixed supports and angle/stroke limits. Undo the latest edit if needed.</dd><dt>Part of the mechanism is off screen</dt><dd>Use Fit view in the bottom toolbar and close side panels for more room.</dd><dt>HTML opens on iPad but controls do not respond</dt><dd>Use Share → Open in Safari instead of previewing inside the Files app.</dd><dt>What does an icon button do?</dt><dd>Hover over it or press Tab to focus it. On touch screens, use this guide to learn the control groups.</dd></dl>"]]}};
  const i18n=window.LinkGoI18n;
  const english=()=>i18n.language==='en';
  const flatten=value=>typeof value==='string'||typeof value==='number'?String(value):Array.isArray(value)?value.map(flatten).join(' '):value&&value.props?flatten(value.props.children):'';
  function describe(label) {
    if(!label)return '';
    if(label.includes('↩'))return english()?'Undo the last design edit.':'Hoàn tác thay đổi thiết kế gần nhất.';
    if(label.includes('↪'))return english()?'Redo a design edit that was undone.':'Làm lại thay đổi thiết kế vừa hoàn tác.';
    const match=[...tips].sort((a,b)=>b[0].length-a[0].length).find(row=>label.includes(row[0]));
    if(match)return match[english()?2:1];
    return english()?'Activate “'+i18n.translate(label)+'”.':'Thực hiện chức năng “'+i18n.translate(label)+'”.';
  }
  let dialog=null,previousFocus=null,tipTarget=null;
  const tooltip=document.createElement('div');tooltip.id='linkgo-functional-tooltip';tooltip.setAttribute('role','tooltip');tooltip.hidden=true;
  document.body.appendChild(tooltip);
  function hideTip(){if(tipTarget){const ids=(tipTarget.getAttribute('aria-describedby')||'').split(/\s+/).filter(id=>id&&id!==tooltip.id);if(ids.length)tipTarget.setAttribute('aria-describedby',ids.join(' '));else tipTarget.removeAttribute('aria-describedby')}tipTarget=null;tooltip.hidden=true}
  function showTip(target){
    if(!target||target.disabled||!target.dataset.linkgoTip)return;
    if(tipTarget===target)return;
    hideTip();tipTarget=target;tooltip.textContent=target.dataset.linkgoTip;tooltip.hidden=false;
    target.setAttribute('aria-describedby',[(target.getAttribute('aria-describedby')||''),tooltip.id].filter(Boolean).join(' '));
    const box=target.getBoundingClientRect(),rect=tooltip.getBoundingClientRect(),margin=8;
    const width=window.innerWidth,height=window.innerHeight;
    tooltip.style.left=Math.max(margin,Math.min(width-rect.width-margin,box.left+box.width/2-rect.width/2))+'px';
    tooltip.style.top=Math.max(margin,box.bottom+rect.height+margin<height?box.bottom+margin:box.top-rect.height-margin)+'px';
  }
  const closest=event=>event.target instanceof Element?event.target.closest('[data-linkgo-tip]'):null;
  document.addEventListener('pointerover',event=>{if(event.pointerType==='touch')return;const target=closest(event);if(target)showTip(target);else hideTip()});
  document.addEventListener('pointerout',event=>{const target=closest(event);if(target&&!target.contains(event.relatedTarget))hideTip()});
  document.addEventListener('focusin',event=>showTip(closest(event)));
  document.addEventListener('focusout',hideTip);
  document.addEventListener('pointerdown',hideTip);
  document.addEventListener('scroll',hideTip,true);
  window.addEventListener('resize',hideTip);
  function renderGuide(){
    const g=guides[english()?'en':'vi'];
    dialog.innerHTML='<header class="lg-guide-header"><h2 id="lg-guide-title">'+g.title+'</h2><button type="button" class="lg-guide-close" aria-label="'+g.close+'">✕</button></header><div class="lg-guide-content"><p class="lg-guide-intro">'+g.intro+'</p><nav aria-label="'+g.nav+'">'+g.sections.map(([id,title])=>'<a href="#lg-guide-'+id+'">'+title+'</a>').join('')+'</nav>'+g.sections.map(([id,title,body])=>'<section id="lg-guide-'+id+'"><h3>'+title+'</h3>'+body+'</section>').join('')+'</div><footer><button type="button" class="lg-guide-close">'+g.close+'</button></footer>';
    dialog.querySelectorAll('.lg-guide-close').forEach(button=>{button.title=g.close;button.addEventListener('click',()=>dialog.close())});
    dialog.querySelectorAll('nav a').forEach(anchor=>anchor.addEventListener('click',event=>{event.preventDefault();dialog.querySelector(anchor.getAttribute('href')).scrollIntoView({block:'start',behavior:'smooth'})}));
  }
  function openGuide(){
    hideTip();previousFocus=document.activeElement;
    if(!dialog){dialog=document.createElement('dialog');dialog.className='lg-guide';dialog.setAttribute('aria-labelledby','lg-guide-title');document.body.appendChild(dialog);dialog.addEventListener('close',()=>{document.documentElement.classList.remove('linkgo-guide-open');if(previousFocus&&previousFocus.isConnected)previousFocus.focus()});}
    if(dialog.open)return;
    renderGuide();document.documentElement.classList.add('linkgo-guide-open');dialog.showModal();dialog.querySelector('.lg-guide-close').focus();
  }
  window.addEventListener('linkgo-language-change',()=>{hideTip();if(dialog&&dialog.open)renderGuide()});
  document.addEventListener('keydown',event=>{if(event.key==='F1'){event.preventDefault();openGuide()}else if(event.key==='Escape')hideTip()});
  window.LinkGoHelp={describe,flatten,open:openGuide};
})();
</script>
