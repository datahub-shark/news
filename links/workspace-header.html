<header id="ls-header">
  <button class="ls-brand" data-ls-command="home" aria-label="linkS — trang thiết kế"><span>link<b>S</b><small>MECHANISM STUDIO</small></span></button>
  <button id="ls-nav-toggle" aria-label="Mở hoặc đóng thanh công cụ">☰</button>
  <div class="ls-title"><b id="ls-design-name">Thiết kế cơ cấu</b><small id="ls-draft-status">Sẵn sàng</small></div>
  <nav class="ls-header-actions" aria-label="Thao tác thiết kế">
    <button data-ls-command="files" title="Mở, lưu JSON và xuất kết quả">Tệp</button>
    <button data-ls-command="tools" title="Thêm khớp, khâu và ràng buộc">＋ Thêm</button>
    <span class="links-divider" aria-hidden="true"></span>
    <button id="ls-undo" data-ls-command="undo" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác (Ctrl+Z)">↶</button>
    <button id="ls-redo" data-ls-command="redo" title="Làm lại (Ctrl+Shift+Z / Ctrl+Y)" aria-label="Làm lại (Ctrl+Shift+Z)">↷</button>
    <button data-ls-command="fit" title="Vừa khung nhìn (F)" aria-label="Vừa khung nhìn (F)">⊡ <span>Vừa khung</span></button>
    <button id="ls-play" data-ls-command="run" title="Chạy / Tạm dừng (Space)">▶ Chạy</button>
  </nav>
  <div class="links-preferences" role="group" aria-label="Tìm kiếm và cài đặt">
    <button class="ls-search-trigger" data-ls-command="search" title="Tìm chức năng (Ctrl+K)" aria-label="Tìm chức năng (Ctrl+K)">⌕ <kbd>Ctrl K</kbd></button>
    <label class="links-language" title="Ngôn ngữ"><span class="links-sr-only">Ngôn ngữ</span><select id="links-language" aria-label="Ngôn ngữ"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="zh-CN">Tiếng Trung</option></select></label>
    <button id="links-theme" data-ls-command="theme" title="Đổi giao diện sáng / tối" aria-label="Đổi giao diện sáng / tối">◐</button>
    <button id="ls-shortcuts" data-ls-command="shortcuts" title="Phím tắt (? / F1)" aria-label="Phím tắt">⌨</button>
    <button data-ls-command="help" title="Hướng dẫn sử dụng" aria-label="Hướng dẫn sử dụng">?</button>
  </div>
</header>
